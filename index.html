<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>uni-sim · entanglement-substrate universe</title>
  <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./src/ui/ui.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud-epoch">—</div>

  <div id="ui">
    <div class="row">
      <div class="cluster">
        <button id="btn-rewind"  title="rewind">⏪</button>
        <button id="btn-play"    title="play / pause">▶</button>
        <button id="btn-forward" title="forward">⏩</button>
      </div>

      <label class="slider">
        <span class="lbl">time</span>
        <input id="slider-time" type="range" min="0" max="1" step="0.0001" value="0" />
        <span class="val" id="hud-time">t = 0 · z = ∞ · Big Bang</span>
      </label>

      <label class="slider">
        <span class="lbl">zoom</span>
        <input id="slider-zoom" type="range" min="0" max="1" step="0.0001" value="0.07" />
        <span class="val" id="hud-zoom">COSMIC ▸ 0.40</span>
      </label>

      <label class="slider short">
        <span class="lbl">speed</span>
        <input id="slider-speed" type="range" min="-3" max="3" step="0.01" value="1" />
        <span class="val" id="hud-speed">×1.0</span>
      </label>

      <div class="cluster">
        <label class="pill"><input id="toggle-entangle" type="checkbox" /><span>entanglement</span></label>
        <label class="pill"><input id="toggle-bloom" type="checkbox" checked /><span>bloom</span></label>
      </div>

      <div class="cluster">
        <button id="btn-save"    title="download save">save</button>
        <button id="btn-load"    title="load file">load</button>
        <input  id="input-load"  type="file" accept="application/json" hidden />
        <button id="btn-newseed" title="new universe">new</button>
      </div>
    </div>
  </div>

  <div id="cursor"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
