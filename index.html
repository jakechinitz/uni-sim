<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>uni-sim · entanglement-substrate universe</title>
  <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./src/ui/ui.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud-epoch">—</div>

  <div id="ui">
    <div class="row">
      <div class="cluster">
        <button id="btn-rewind"  data-tip="Rewind time toward the Big Bang">⏪</button>
        <button id="btn-play"    data-tip="Play / pause the cosmic clock">▶</button>
        <button id="btn-forward" data-tip="Play forward in time">⏩</button>
      </div>

      <label class="slider time-slider" data-tip="Scrub cosmic time from the Big Bang (0) to today (13.8 Gyr). Past today, play keeps going into the future.">
        <span class="lbl">time</span>
        <div class="time-track">
          <input id="slider-time" type="range" min="0" max="1" step="0.0001" value="0" />
          <div class="time-epochs">
            <!-- Epoch ticks. Positions computed from the scrubToTime
                 inverse so they land at the right scrub value. -->
            <!-- Positions computed from the exponential scrub→time map:
                 t(s) = 13.8 * (e^(8s)-1)/(e^8-1). The early universe is
                 compressed visually because we spend most slider real
                 estate showing matter-domination through today. -->
            <span class="ep" style="left:0%"     data-tip="Big Bang · t = 0 · the singularity">Big Bang</span>
            <span class="ep" style="left:1%"     data-tip="EDE Pulse · z ≈ 3000 (~50 kyr after Big Bang) — paper §18 Hubble-tension mechanism fires here">EDE</span>
            <span class="ep" style="left:39%"    data-tip="First stars + black holes form (~100 Myr)">First stars</span>
            <span class="ep" style="left:67%"    data-tip="First galaxies condense (~1 Gyr)">Galaxies</span>
            <span class="ep" style="left:84%"    data-tip="Cosmic-web filaments materialise (~4 Gyr)">Web</span>
            <span class="ep" style="left:100%"   data-tip="Present day (13.8 Gyr) — past this point you're in the future">Today</span>
          </div>
        </div>
        <span class="val" id="hud-time">t = 0 · z = ∞ · Big Bang</span>
        <button id="btn-bigbang" class="pill-btn small" data-tip="Reset to the Big Bang and play forward at a slow pace so you can watch each epoch unfold">↺ Big Bang</button>
      </label>

      <label class="slider zoom-slider" data-tip="Pick the scale you're looking at. Bands: cosmic web → galaxy → solar system → tetrahedral substrate.">
        <span class="lbl">zoom</span>
        <div class="zoom-track">
          <input id="slider-zoom" type="range" min="0" max="1" step="0.0001" value="0.07" />
          <div class="zoom-bands">
            <span style="left:0%;   width:25%">COSMIC</span>
            <span style="left:25%;  width:25%">GALAXY</span>
            <span style="left:50%;  width:25%">SYSTEM</span>
            <span style="left:75%;  width:25%">SUBSTRATE</span>
          </div>
        </div>
        <span class="val" id="hud-zoom">COSMIC ▸ 0.40</span>
      </label>

      <label class="slider" data-tip="How fast cosmic time advances. Drag left for slow-mo, right for fast-forward.">
        <span class="lbl">speed</span>
        <input id="slider-speed" type="range" min="-18" max="18" step="0.05" value="16.5" />
        <span class="val" id="hud-speed">1.00 Gyr/s</span>
        <div id="speed-presets" class="chips">
          <button class="chip" data-exp="-15" data-tip="fs per real-second — slow enough that substrate ripples crawl">Quantum</button>
          <button class="chip" data-exp="-2"  data-tip="10 ms per real-second — slow enough to watch photons cross a system">Light</button>
          <button class="chip" data-exp="0"   data-tip="1× real time">Real</button>
          <button class="chip" data-exp="4.94" data-tip="One Earth-day per real-second (watch a planet rotate)">Day/s</button>
          <button class="chip" data-exp="7.5"  data-tip="One year per real-second (watch planetary orbits)">Year/s</button>
          <button class="chip" data-exp="13.5" data-tip="One million years per real-second (watch a galaxy rotate)">Myr/s</button>
          <button class="chip" data-exp="16.5" data-tip="One billion years per real-second (watch the universe evolve)">Gyr/s</button>
        </div>
      </label>

      <div class="cluster">
        <label class="pill" data-tip="Show the entanglement-substrate field around masses. Field lines follow whatever you're dragging."><input id="toggle-entangle" type="checkbox" /><span>entanglement</span></label>
        <label class="pill" data-tip="Cinematic glow on bright objects. Looks gorgeous but can wash out the screen at galaxy scale."><input id="toggle-bloom" type="checkbox" checked /><span>bloom</span></label>
        <label class="pill" data-tip="Show the spiral disk overlay in galaxy view. Turn off to see just the stars + BHs."><input id="toggle-disk" type="checkbox" checked /><span>disk</span></label>
        <label class="pill" data-tip="Many-Pasts (paper §21). When rewinding time, faint ghost trajectories show alternate histories consistent with the present — operational reduction made visible. Only visible when ⏪ rewinding."><input id="toggle-manypasts" type="checkbox" /><span>many-pasts</span></label>
        <button id="btn-closure" class="pill-btn" data-tip="Show the live derivation chain that takes 1,680 tetrahedral microstates to Newton's G">closure</button>
      </div>

      <div class="cluster">
        <button id="btn-save"    data-tip="Download the current universe as a JSON save file">save</button>
        <button id="btn-load"    data-tip="Load a previously saved universe">load</button>
        <input  id="input-load"  type="file" accept="application/json" hidden />
        <button id="btn-newseed" data-tip="Generate a fresh random universe (new seed)">new</button>
      </div>
    </div>
  </div>

  <div id="cursor"></div>

  <div id="closure-panel" class="hidden">
    <div class="panel-head">
      <div class="panel-title">Closure chain · 1,680 microstates → Newton's <i>G</i></div>
      <button id="btn-closure-close" class="x" data-tip="Close panel">×</button>
    </div>
    <div class="panel-body" id="closure-body"></div>
  </div>

  <div id="hover-card" class="hidden"></div>
  <div id="tip"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
